<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Общежитие</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Заселение в общежитие</h2>
    
    <form id="checkForm">
        <div>
            <label for="studentId">ID студента:</label><br>
            <input type="text" id="studentId" required>
        </div>
        <br>
        <div>
            <label for="buildingNum">Номер корпуса:</label><br>
            <input type="text" id="buildingNum" required>
        </div>
        <br>
        <div>
            <label for="roomNum">Номер комнаты:</label><br>
            <input type="text" id="roomNum" required>
        </div>
        <br>
        <button type="submit">Проверить</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
